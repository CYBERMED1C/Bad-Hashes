name: Update confirmed bad hashes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-hashes.yml"
      - "config/**"
      - "scripts/**"
  schedule:
    - cron: "17 9 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-confirmed-bad-hashes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Download approved ESET source
        run: git clone --depth 1 https://github.com/eset/malware-ioc.git _sources/eset

      - name: Build and validate the hash files
        run: python3 scripts/update_hashes.py --source-root _sources/eset --output-dir .

      - name: Commit verified changes
        shell: bash
        run: |
          git add feed_status.json hashblock.csv hashes_sha256.txt hashes_sha256_comma.txt
          if git diff --cached --quiet; then
            echo "No approved hash changes were found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record daily hash feed check"
          git push
